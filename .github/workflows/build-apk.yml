name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create android/local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --release --stacktrace 2>&1 | tee /tmp/build.log

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p ci
          tail -c 60000 /tmp/build.log > ci/last-build-error.log || true
          git config user.name "ci"
          git config user.email "ci@aspar.local"
          git add -f ci/last-build-error.log
          git commit -m "CI: build error log [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main || echo "push failed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsparDPI-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
